name: Keep Supabase Alive

on:
  schedule:
    # Jalan setiap hari Senin dan Kamis jam 09:00 UTC (16:00 WIB)
    - cron: '0 9 * * 1,4'
  workflow_dispatch: # Memungkinkan trigger manual dari UI GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "🔄 Pinging Supabase to keep it alive..."
          response=$(curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP Status: %{http_code}")
          
          echo "$response"
          echo "✅ Ping completed successfully!"
      
      - name: Query Database (Simple Health Check)
        run: |
          echo "🔍 Running health check query..."
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/kelas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
          
          echo ""
          echo "✅ Database query completed!"
      
      - name: Summary
        run: |
          echo "✨ Keep-alive workflow completed successfully"
          echo "📅 Next scheduled run: Monday or Thursday at 09:00 UTC"
